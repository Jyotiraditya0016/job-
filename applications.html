<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - AI Job Portal</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-robot"></i>
                <span>AI Job Portal</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="upload-resume.html" class="nav-item">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Upload Resume</span>
                </a>
                <a href="job-matches.html" class="nav-item">
                    <i class="fas fa-magic"></i>
                    <span>Job Matches</span>
                </a>
                <a href="applications.html" class="nav-item active">
                    <i class="fas fa-file-alt"></i>
                    <span>Applications</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search applications...">
                </div>
                
                <div class="user-menu">
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="user-profile" id="userProfile">
                        <img src="../../assets/images/default-avatar.png" alt="Profile">
                        <span>John Doe</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content">
                <div class="page-header">
                    <h1 class="page-title">My Applications</h1>
                    <div class="application-filters">
                        <select id="statusFilter" class="filter-select">
                            <option value="all">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="shortlisted">Shortlisted</option>
                            <option value="rejected">Rejected</option>
                            <option value="hired">Hired</option>
                        </select>
                        <select id="sortBy" class="filter-select">
                            <option value="date">Sort by Date</option>
                            <option value="score">Sort by Match Score</option>
                            <option value="company">Sort by Company</option>
                        </select>
                    </div>
                </div>
                
                <!-- Loading Spinner -->
                <div class="loading-spinner" id="loadingSpinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading your applications...</p>
                </div>
                
                <!-- Error Message -->
                <div class="error-message" id="errorMessage" style="display: none;"></div>
                
                <!-- Applications Container -->
                <div id="applicationsContainer" style="display: none;"></div>
            </div>
        </main>
    </div>

    <!-- Application Details Modal -->
    <div class="modal" id="applicationModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="applicationDetails"></div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/jobseeker.js"></script>
</body>
</html>

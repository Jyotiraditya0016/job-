<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Applicants - AI Job Portal</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-robot"></i>
                <span>AI Job Portal</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="post-job.html" class="nav-item">
                    <i class="fas fa-plus-circle"></i>
                    <span>Post a Job</span>
                </a>
                <a href="manage-jobs.html" class="nav-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Manage Jobs</span>
                </a>
                <a href="view-applicants.html" class="nav-item active">
                    <i class="fas fa-users"></i>
                    <span>View Applicants</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-building"></i>
                    <span>Company Profile</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search applicants...">
                </div>
                
                <div class="user-menu">
                    <div class="notifications">
                        <i class="fas fa-bell"></i>
                        <span class="badge">5</span>
                    </div>
                    <div class="user-profile" id="userProfile">
                        <img src="../../assets/images/company-avatar.png" alt="Profile">
                        <span>Tech Corp</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content">
                <div class="page-header">
                    <h1 class="page-title">Applicants</h1>
                    <div class="job-selector">
                        <select id="jobSelector" class="filter-select">
                            <option value="">Select a job to view applicants</option>
                        </select>
                    </div>
                </div>
                
                <!-- Loading Spinner -->
                <div class="loading-spinner" id="loadingSpinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading applicants...</p>
                </div>
                
                <!-- Error Message -->
                <div class="error-message" id="errorMessage" style="display: none;"></div>
                
                <!-- Applicants Grid -->
                <div id="applicantsContainer" style="display: none;">
                    <!-- Applicants will be displayed here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Applicant Details Modal -->
    <div class="modal" id="applicantModal">
        <div class="modal-content modal-lg">
            <span class="close-modal">&times;</span>
            <div id="applicantDetails"></div>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/recruiter.js"></script>
</body>
</html>
